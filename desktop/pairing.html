<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https: wss:; script-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect snip</title>
    <style>
      :root {
        color: #131315;
        background: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          Arial, sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        min-width: 320px;
        min-height: 420px;
      }
      .titlebar {
        -webkit-app-region: drag;
      }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition-property: transform, background-color, box-shadow;
        transition-duration: 150ms;
        transition-timing-function: ease-out;
        -webkit-app-region: no-drag;
      }
      button:focus-visible {
        outline: 2px solid #ff6600;
        outline-offset: 2px;
      }
      button:active {
        transform: scale(0.96);
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:disabled:active {
        transform: none;
      }
      .primary {
        color: white;
        background: #131315;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.06),
          0 1px 2px -1px rgba(0, 0, 0, 0.08),
          0 2px 4px rgba(0, 0, 0, 0.06);
      }
      .primary:hover:not(:disabled) {
        background: #2a2a2e;
      }
      .secondary {
        color: #131315;
        background: white;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.1),
          0 1px 2px -1px rgba(0, 0, 0, 0.06);
      }
      .secondary:hover:not(:disabled) {
        background: #f5f5f6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pairing-main.tsx"></script>
  </body>
</html>
