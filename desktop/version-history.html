<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>File history</title>
    <style>
      :root {
        color: #1a1a1a;
        background: #f0f0e8;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; min-height: 100%; }
      body { min-width: 560px; -webkit-font-smoothing: antialiased; }
      button {
        border: 2px solid #1a1a1a;
        border-radius: 0;
        background: #f0f0e8;
        color: #1a1a1a;
        cursor: pointer;
        font: 700 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        padding: 7px 10px;
      }
      button:hover:not(:disabled) { background: #1a1a1a; color: #f0f0e8; }
      button:focus-visible { outline: 2px solid #c2410c; outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: 0.45; }
      ::selection { background: #fdba74; color: #1a1a1a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/version-history-main.tsx"></script>
  </body>
</html>
